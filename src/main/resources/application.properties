spring.application.name=auth-service
server.port=8083

# PostgreSQL (Auth DB)
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/nobroker_auth}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Register with Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT Configuration
# Secret key must be Base64 encoded and at least 256 bits (32 chars)
jwt.secret=${JWT_SECRET:}
# 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
